<div class="row justify-content-center page-background g-4">

  <!-- Estado vacío -->
  <div *ngIf="!loading && clases.length === 0" class="col-12 text-center p-5">
    <h3 class="empty-title">🎒 Aún no estás en ninguna clase</h3>
    <p class="text-muted">
      Pide el código a tu profe para comenzar tu aventura 🚀
    </p>
  </div>

  @for (item of clases; track item.id) {
    <div class="col-sm-6 col-lg-4 card-col">

      <mat-card
        class="cardWithShadow clickable-card h-100 position-relative overflow-hidden"
      >
        <!-- Link general -->
        <a
          [routerLink]="['/estudiante/clase', item.id, 'evaluaciones']"
          class="stretched-link"
          aria-label="Entrar a la clase"
        ></a>

        <!-- Imagen -->
        <div class="card-image-wrapper">
          <img
            mat-card-image
            [src]="item.imagenUrl || defaultImage"
            [alt]="item.nombre"
            class="card-img-fixed"
          />
        </div>

        <!-- Contenido -->
        <mat-card-content class="card-content">

          <!-- Título -->
<mat-card-title class="card-title font-title text-truncate">
  🧩 {{ item.nombre }}
</mat-card-title>


          <!-- Información -->
          <div class="card-info">
            <span>
              👩‍🏫 <strong>Profesor:</strong> {{ getDocenteNombre(item) }}
            </span>

            <span>
              🎒 <strong>Grado:</strong> {{ item.grado?.nombre || 'N/A' }}
            </span>
          </div>

          <!-- Progreso -->
          <div class="progress-container">
            <div class="progress-bar" style="width: 60%"></div>
          </div>

          <!-- Footer -->
          <div class="card-footer">
            <span class="date">
              🗓️ {{ item.createdAt | date : 'mediumDate' }}
            </span>

            <!-- Botón tipo juego -->
           <a
  class="badge-kenney"
  [routerLink]="['/estudiante/clase', item.id, 'evaluaciones']"
  (click)="$event.stopPropagation()"
>
  <img
    src="assets/kenney/Vector/Yellow/button_rectangle_depth_flat.svg"
    alt=""
  />
  <span class="badge-text">Iniciar</span>
</a>
          </div>

        </mat-card-content>
      </mat-card>

    </div>
  }
</div>
