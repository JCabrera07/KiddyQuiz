<div class="row justify-content-center page-background g-4 m-0">

  <div *ngIf="!loading && clases.length === 0" class="col-12">
    <div class="empty-state-container">
      <h3 class="empty-title">🎒 Aún no estás en ninguna clase</h3>
      <p class="text-muted" style="font-size: 1.1rem;">
        Pide el código a tu profe para comenzar tu aventura 🚀
      </p>
    </div>
  </div>

  @for (item of clases; track item.id) {
    <div class="col-sm-6 col-lg-4 card-col">

      <div class="fun-card">
        
        <a
          [routerLink]="['/estudiante/clase', item.id, 'evaluaciones']"
          class="stretched-link"
          style="z-index: 1;"
          aria-label="Entrar a la clase"
        ></a>

        <div class="card-image-wrapper">
          <img
            [src]="item.imagenUrl || defaultImage"
            [alt]="item.nombre"
            class="card-img-fixed"
          />
        </div>

        <div class="card-content">
          
          <div class="card-body-inner">
            <h3 class="card-title text-truncate">
              🧩 {{ item.nombre }}
            </h3>

            <div class="info-row">
              <span class="info-chip">
                👩‍🏫 {{ getDocenteNombre(item) }}
              </span>
              <span class="info-chip">
                🎓 {{ item.grado?.nombre || 'General' }}
              </span>
            </div>

            <div class="fun-progress-container" title="Progreso del curso">
              <div class="fun-progress-bar" style="width: 60%"></div>
            </div>
          </div>

          <div class="card-footer">
            <span class="date">
              🗓️ {{ item.createdAt | date : 'dd/MM/yyyy' }}
            </span>

            <a
              class="btn-fun-action"
              [routerLink]="['/estudiante/clase', item.id, 'evaluaciones']"
              style="position: relative; z-index: 2;"
            >
              ¡Entrar! 🚀
            </a>
          </div>

        </div>
      </div>

    </div>
  }
</div>
