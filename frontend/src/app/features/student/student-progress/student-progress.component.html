<div class="progress-container" *ngIf="!isLoading">
  
  <div class="header-section">
    <h2>🗺️ Mi Mapa de Aventuras</h2>
    <p>¡Completa todas las misiones para llegar a la meta! 🚀</p>
  </div>

  <div class="path-wrapper">
    <div class="path-track">
      <div class="connection-line"></div>

      <div 
        class="path-node" 
        *ngFor="let item of competenciasConProgreso; let i = index"
        [matTooltip]="item.nombre + ': ' + (item.porcentaje | number:'1.0-0') + '% completado'"
        matTooltipPosition="above"
      >
        <div 
          class="progress-circle"
          [class.completed]="item.logrado"
          [class.in-progress]="item.porcentaje > 0 && !item.logrado"
          [style.--percent]="item.porcentaje"
        >
          <div class="inner-circle">
            <span *ngIf="item.logrado" class="check-icon">🏆</span>
            <span *ngIf="!item.logrado" class="step-number">{{ i + 1 }}</span>
          </div>
        </div>
        
        <div class="node-info">
          <span class="node-title text-truncate" style="max-width: 120px;">
            {{ item.nombre }}
          </span>
          <span class="node-percent" [class.text-success]="item.logrado">
            {{ item.porcentaje | number:'1.0-0' }}%
          </span>
        </div>

      </div>
    </div>
  </div>

  <div class="details-grid mt-5">
    <mat-card *ngFor="let item of competenciasConProgreso" class="detail-card">
      <mat-card-content class="p-3">
        <div class="d-flex justify-content-between align-items-start gap-3">
          <div>
            <h5 class="card-title-fun">🧩 {{ item.nombre }}</h5>
            <small class="text-muted d-block mb-2">{{ item.descripcion }}</small>
            
            <div class="progress" style="height: 8px; border-radius: 4px; background-color: #eee;">
              <div 
                class="progress-bar" 
                [style.width.%]="item.porcentaje"
                [style.background-color]="item.logrado ? '#66BB6A' : '#FFB74D'"
              ></div>
            </div>
          </div>

          <div class="status-badge" [class.done]="item.logrado">
            {{ item.logrado ? '¡LOGRADO!' : 'EN CURSO' }}
          </div>
        </div>
      </mat-card-content>
    </mat-card>
  </div>

</div>

<div *ngIf="isLoading" class="d-flex flex-column align-items-center justify-content-center p-5" style="min-height: 50vh;">
  <mat-spinner diameter="60" color="accent"></mat-spinner>
  <p class="mt-3 text-muted" style="font-family: 'Comic Sans MS', cursive;">Cargando tu mapa...</p>
</div>
