<mat-card class="cardWithShadow theme-card">
  <div class="p-6 flex justify-between items-center">

    <div class="flex items-center gap-4">
      <span *ngIf="error" class="text-red-500 text-sm font-medium bg-red-50 px-2 py-1 rounded">
        {{ error }}
      </span>

      <button mat-raised-button color="primary" (click)="crearClase()">
        Crear Clase
      </button>
    </div>
  </div>

  <mat-progress-bar *ngIf="cargando" mode="indeterminate" color="primary"></mat-progress-bar>

  <mat-card-content class="border-t border-border">
    <div class="relative overflow-auto">
      <table mat-table [dataSource]="clases" class="min-w-full">

        <!-- Columna IMG -->
        <ng-container matColumnDef="img">
          <th mat-header-cell *matHeaderCellDef class="font-semibold text-sm">IMG</th>
          <td mat-cell *matCellDef="let element" class="whitespace-nowrap">
            <img 
              [src]="element.imagenUrl ? element.imagenUrl : 'assets/images/products/product-1.jpg'" 
              alt="clase" 
              width="60" 
              class="rounded"
            />
          </td>
        </ng-container>

        <!-- Columna Asignatura -->
        <ng-container matColumnDef="asignatura">
          <th mat-header-cell *matHeaderCellDef class="font-semibold text-sm">Asignatura</th>
          <td mat-cell *matCellDef="let element" class="whitespace-nowrap">
            {{ element.nombre || 'N/A' }}
          </td>
        </ng-container>

        <!-- Columna Grado -->
        <ng-container matColumnDef="grado">
          <th mat-header-cell *matHeaderCellDef class="font-semibold text-sm">Grado</th>
          <td mat-cell *matCellDef="let element" class="whitespace-nowrap">
            {{ element.grado?.nombre || 'N/A' }}
          </td>
        </ng-container>

        <!-- Columna Fecha Creación -->
        <ng-container matColumnDef="fecha">
          <th mat-header-cell *matHeaderCellDef class="font-semibold text-sm">Fecha Creación</th>
          <td mat-cell *matCellDef="let element" class="whitespace-nowrap">
            {{ element.createdAt | date:'mediumDate' }}
          </td>
        </ng-container>

        <!-- Columna Acciones -->
        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef class="font-semibold text-sm"></th>
          <td mat-cell *matCellDef="let element" class="text-right">
            <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Opciones">
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #menu="matMenu">
              <button mat-menu-item>
                <mat-icon>assignment</mat-icon>
                <span>Ver Evaluaciones</span>
              </button>
              <button mat-menu-item>
                <mat-icon>edit</mat-icon>
                <span>Editar Clase</span>
              </button>
            </mat-menu>
          </td>
        </ng-container>

        <!-- Filas -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

        <!-- Mensaje cuando no hay clases -->
        <tr class="mat-row" *ngIf="!cargando && clases.length === 0">
          <td class="mat-cell text-center p-4" colspan="5">No hay clases asignadas</td>
        </tr>
      </table>
    </div>
  </mat-card-content>
</mat-card>
