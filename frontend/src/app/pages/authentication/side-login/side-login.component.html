<div class="blank-layout-container justify-content-center align-items-center bg-light">
  <div class="position-relative row w-100 h-100 bg-gredient justify-content-center">
    <div class="col-lg-4 d-flex align-items-center">
      <mat-card class="cardWithShadow boxed-auth">
        <mat-card-content class="p-32">
          <div class="text-center">
            <a [routerLink]="['/dashboard']">
              <img src="./assets/images/logos/horizontal.png" style="width: 250px; height: auto;" class="align-middle m-2" alt="logo" />
            </a>
          </div>

          <form [formGroup]="form" (ngSubmit)="submit()">
  <!-- Usuario -->

<mat-label class="mat-subtitle-2 f-s-14 f-w-600 m-b-12 d-block">Usuario</mat-label>
  <mat-form-field appearance="outline" class="w-100">
    <input matInput formControlName="username" >
    <mat-error *ngIf="f.username.touched && f.username.invalid">
      <span *ngIf="f.username.errors?.['required']">El usuario es obligatorio.</span>
      <span *ngIf="f.username.errors?.['minlength']">Mínimo 6 caracteres.</span>
    </mat-error>
  </mat-form-field>

  <!-- Contraseña -->

<mat-label class="mat-subtitle-2 f-s-14 f-w-600 m-b-12 d-block">Contraseña</mat-label>
  <mat-form-field appearance="outline" class="w-100">
    <input matInput type="password" formControlName="password">
    <mat-error *ngIf="f.password.touched && f.password.invalid">
      La contraseña es obligatoria.
    </mat-error>
  </mat-form-field>

  <!-- Botón de submit -->
  <button mat-flat-button color="primary" class="w-100 custom-button" type="submit">
    Iniciar sesión
  </button>
</form>


          <span class="d-block f-w-500 text-center m-t-24">
            ¿No tienes una cuenta?
            <a [routerLink]="['/authentication/register']" class="text-decoration-none text-secondary f-w-500 f-s-14">
              Registrarme
            </a>
          </span>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
