<div class="d-flex justify-content-between align-items-center px-4 py-3 border-bottom">
  <div class="d-flex align-items-center">
    <mat-icon class="text-primary me-2">auto_awesome</mat-icon>
    <h2 mat-dialog-title class="m-0 fs-5">Análisis de Inteligencia Artificial</h2>
  </div>
  <button mat-icon-button (click)="cerrar()">
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content class="p-4">
  <div class="ai-content" [innerHTML]="formattedContent"></div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="px-4 pb-3">
  <button mat-flat-button color="primary" (click)="cerrar()">Entendido</button>
</mat-dialog-actions>
